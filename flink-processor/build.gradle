plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.trend'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '1.19.0'
}

dependencies {
    // Flink Core (provided in the running cluster environment)
    compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
    compileOnly "org.apache.flink:flink-clients:${flinkVersion}"

    // Flink Connectors & Format (must be packaged inside the Shadow/Fat Jar)
    implementation "org.apache.flink:flink-connector-kafka:3.2.0-1.19"
    implementation "org.apache.flink:flink-json:${flinkVersion}"
    
    // Redis Client for reading weights/rules
    implementation "io.lettuce:lettuce-core:6.3.2.RELEASE"
    
    // JSON Parsing
    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.2"

    // Logging
    implementation "org.slf4j:slf4j-api:2.0.7"
    implementation "org.slf4j:slf4j-simple:2.0.7"

    // Testing
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.trend.jobs.TrendDetectionJob'
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

test {
    useJUnitPlatform()
}
